<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriForce Landing Mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8faf9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle background pattern */
    .bg-pattern {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 50% 40%, rgba(29, 158, 117, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 30% 70%, rgba(8, 80, 65, 0.03) 0%, transparent 40%);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
    }

    /* Logo */
    .logo-mark {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #1D9E75 0%, #085041 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.75rem;
      box-shadow: 0 6px 20px rgba(29, 158, 117, 0.25);
    }
    .logo-mark svg {
      width: 28px;
      height: 28px;
    }
    .brand-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: #085041;
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    /* 2x2 Grid of cubes */
    .cubes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
      perspective: 800px;
    }

    .cube {
      aspect-ratio: 1;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .cube::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .cube:hover {
      transform: translateY(-6px) scale(1.04);
      z-index: 10;
    }
    .cube:active {
      transform: translateY(-2px) scale(0.98);
    }

    /* Cube 1: Trainer (Athlete) */
    .cube-trainer {
      background: linear-gradient(145deg, #1D9E75 0%, #158a63 50%, #0d6b4d 100%);
      box-shadow: 0 12px 28px rgba(29, 158, 117, 0.3), 0 4px 8px rgba(29, 158, 117, 0.15);
    }
    .cube-trainer:hover {
      box-shadow: 0 20px 40px rgba(29, 158, 117, 0.4), 0 6px 12px rgba(29, 158, 117, 0.2);
    }

    /* Cube 2: Coach */
    .cube-coach {
      background: linear-gradient(145deg, #475569 0%, #334155 50%, #1e293b 100%);
      box-shadow: 0 12px 28px rgba(51, 65, 85, 0.25), 0 4px 8px rgba(51, 65, 85, 0.12);
    }
    .cube-coach:hover {
      box-shadow: 0 20px 40px rgba(51, 65, 85, 0.35), 0 6px 12px rgba(51, 65, 85, 0.18);
    }

    /* Cube 3: Challenges */
    .cube-challenges {
      background: linear-gradient(145deg, #e07b3a 0%, #c45e2b 50%, #a34820 100%);
      box-shadow: 0 12px 28px rgba(192, 94, 43, 0.25), 0 4px 8px rgba(192, 94, 43, 0.12);
    }
    .cube-challenges:hover {
      box-shadow: 0 20px 40px rgba(192, 94, 43, 0.35), 0 6px 12px rgba(192, 94, 43, 0.18);
    }

    /* Cube 4: Setup */
    .cube-setup {
      background: linear-gradient(145deg, #2563eb 0%, #1d4ed8 50%, #1e40af 100%);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25), 0 4px 8px rgba(37, 99, 235, 0.12);
    }
    .cube-setup:hover {
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.35), 0 6px 12px rgba(37, 99, 235, 0.18);
    }

    /* Cube content */
    .cube-icon {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      backdrop-filter: blur(4px);
    }
    .cube-label {
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .cube-sublabel {
      color: rgba(255,255,255,0.6);
      font-size: 0.7rem;
    }

    /* Footer hint */
    .footer-hint {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #cbd5e1;
    }

    /* Mobile */
    @media (max-width: 380px) {
      .cubes-grid {
        gap: 0.75rem;
      }
      .cube {
        border-radius: 16px;
      }
      .cube-icon {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
        border-radius: 10px;
      }
      .cube-label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="content">
    <!-- Logo -->
    <div class="logo-mark">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="6"/>
        <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
      </svg>
    </div>
    <h1 class="brand-name">TriForce</h1>
    <p class="tagline">מעקב אימונים ואתגרים לקבוצה</p>

    <!-- 4 Cubes Grid -->
    <div class="cubes-grid">
      <!-- Cube 1: Trainer -->
      <div class="cube cube-trainer">
        <div class="cube-icon">🏃</div>
        <div class="cube-label">מתאמן</div>
        <div class="cube-sublabel">Strava</div>
      </div>

      <!-- Cube 2: Coach -->
      <div class="cube cube-coach">
        <div class="cube-icon">👤</div>
        <div class="cube-label">מאמן</div>
        <div class="cube-sublabel">כניסת מאמנים</div>
      </div>

      <!-- Cube 3: Challenges -->
      <div class="cube cube-challenges">
        <div class="cube-icon">🏆</div>
        <div class="cube-label">אתגרים</div>
        <div class="cube-sublabel">האתגרים שלך</div>
      </div>

      <!-- Cube 4: Setup -->
      <div class="cube cube-setup">
        <div class="cube-icon">⚙️</div>
        <div class="cube-label">הגדרות</div>
        <div class="cube-sublabel">חיבור מכשירים</div>
      </div>
    </div>

    <p class="footer-hint">ניתן לחבר Garmin בשלב מאוחר יותר</p>
  </div>
</body>
</html>
